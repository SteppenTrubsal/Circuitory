# Leading commas and constructor separators, with two-space indentation.
steps:
  # Field comments are emitted on separate lines by the records formatter.
  - records:
      equals: "indent 2"
      first_field: "indent 2"
      field_comment: 2
      deriving: 2
      via: "indent 2"
      sort_deriving: false
      break_enums: true
      break_single_constructors: false
      curried_context: false

  # Align single-line case alternatives, function equations and field types.
  # This step does not align <- bindings in do blocks.
  - simple_align:
      cases: always
      top_level_patterns: always
      records: always
      multi_way_if: always

  - imports:
      align: global
      pad_module_names: true
      group_imports: true
      post_qualify: false
      list_align: after_alias
      long_list_align: inline
      separate_lists: true
      space_surround: false

  - trailing_whitespace: {}

columns: null
newline: lf
cabal: true
